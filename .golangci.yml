version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - noctx
    - predeclared
    - revive
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    errcheck:
      # Cleanup paths deliberately ignore errors; they must never mask the
      # original failure.
      exclude-functions:
        - (*os.File).Close
        - os.Remove
    goconst:
      min-len: 4
      min-occurrences: 4
      # Terraform attribute names and limactl subcommand tokens are repeated
      # by design: each occurrence is a distinct schema key or argument
      # position. Hoisting them into constants would obscure the schema and
      # break the one-to-one mapping with the documented CLI contract.
      ignore-string-values: "^(lima|binary|home|name_prefix|name|status|raw_status|ssh_[a-z_]+|lima_version|vm_type|hostname|config|info|create|edit|start|stop|delete|protect|unprotect|list|validate|limactl|running|stopped|system|user|aarch64|x86_64|template|memory|disk|cpus|arch|protected|dir|size|format|mount_point|in_use_by|timeouts|data|--size|--format)$"
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

  exclusions:
    rules:
      # Test helpers legitimately return unparameterised values and use long
      # literal fixtures.
      - path: _test\.go
        linters:
          - goconst
          - unparam
      # The fake limactl mirrors Lima's own command surface, so its switch is
      # necessarily long.
      - path: internal/testutil/
        linters:
          - gocritic
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/guidoiaquinti/terraform-provider-lima
