version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - noctx
    - predeclared
    - revive
    - unconvert
    - unparam
    - wastedassign
    - whitespace

  settings:
    errcheck:
      # Cleanup paths deliberately ignore errors; they must never mask the
      # original failure.
      exclude-functions:
        - (*os.File).Close
        - os.Remove
    goconst:
      min-len: 4
      min-occurrences: 4
      # Terraform attribute names and limactl subcommand tokens are repeated
      # by design: each occurrence is a distinct schema key or argument
      # position. Hoisting them into constants would obscure the schema and
      # break the one-to-one mapping with the documented CLI contract.
      #
      # Note that the `_test.go` exclusion below suppresses *reports* in test
      # files but not the counting, so adding tests that name a schema key can
      # push a production occurrence over the threshold. That is what added
      # `default_timeout` and the disk formats here; both are schema vocabulary,
      # not incidental duplication.
      #
      # A list of patterns, not one string: the schema requires an array, and
      # `golangci-lint config verify` rejects the string form even though `run`
      # happens to accept it. The lint target verifies the config first so that
      # cannot go unnoticed again.
      ignore-string-values:
        # Provider and resource schema attribute names.
        - "^(binary|home|name_prefix|name|config|timeouts|default_timeout)$"
        - "^(vm_type|arch|cpus|memory|disk|size|format|template|protect|start)$"
        - "^(status|raw_status|hostname|dir|protected|mount_point|in_use_by)$"
        - "^(ssh_[a-z_]+|lima_version)$"
        # limactl subcommands and flags, which mirror the documented CLI
        # contract one-to-one.
        - "^(info|create|edit|start|stop|delete|protect|unprotect|list|validate)$"
        - "^(limactl|lima|--size|--format)$"
        # Values Lima itself reports or accepts.
        - "^(running|stopped|system|user|aarch64|x86_64|qcow2|raw|data)$"
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

  exclusions:
    rules:
      # Test helpers legitimately return unparameterised values and use long
      # literal fixtures.
      - path: _test\.go
        linters:
          - goconst
          - unparam
      # The fake limactl mirrors Lima's own command surface, so its switch is
      # necessarily long.
      - path: internal/testutil/
        linters:
          - gocritic
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/guidoiaquinti/terraform-provider-lima
