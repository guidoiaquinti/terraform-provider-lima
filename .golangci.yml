version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # These inspect frameworks or protocols the provider does not use. Leaving
    # them enabled adds analysis time without protecting reachable code.
    - arangolint
    - clickhouselint
    - ginkgolinter
    - loggercheck
    - promlinter
    - protogetter
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - unqueryvet
    - zerologlint

    # Superseded linters. Their replacements remain enabled unless listed in
    # the policy section below.
    - gomodguard
    - wsl

    # Deliberate project policy. These rules either conflict with idiomatic Go
    # and Terraform framework APIs, duplicate a stronger enabled check, or
    # turn established formatting preferences into low-signal churn.
    - cyclop
    - depguard
    - dupl
    - err113
    - exhaustruct
    - funcorder
    - funlen
    - gocognit
    - goconst
    - gocyclo
    - interfacebloat
    - ireturn
    - lll
    - maintidx
    - mnd
    - nlreturn
    - noinlineerr
    - paralleltest
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl_v5

  exclusions:
    rules:
      # Test helpers legitimately return unparameterised values, use long
      # literal fixtures, and keep shared harness state.
      - path: _test\.go
        linters:
          - goconst
          - gochecknoglobals
          - unparam
      # The fake limactl mirrors Lima's own command surface, so its switch is
      # necessarily long.
      - path: internal/testutil/
        linters:
          - gochecknoglobals
          - gocritic
          - unparam
      # These package variables are immutable lookup tables, supported-value
      # vocabularies, or documented defaults. New production globals remain
      # findings unless deliberately added to this allowlist.
      - text: ^(redactedEnvKeys|diskInUseMarkers|diskExistsMarkers|diskShrinkMarkers|notFoundMarkers|protectedMarkers|alreadyExistsMarkers|AllStatuses|rawStatusMap|DefaultTimeouts|sizeUnits|KnownVMTypes|KnownArches|KnownProvisionModes|MinimumVersion|MaxTestedVersion) is a global variable$
        linters:
          - gochecknoglobals
      # Tests intentionally exercise variable fixture paths and executable
      # scripts. Keep every other gosec rule active in tests.
      - path: _test\.go
        text: "G(301|304|306|703):"
        linters:
          - gosec
      # The reusable fake limactl must be executable by the test process.
      - path: internal/testutil/
        text: "G306:"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
