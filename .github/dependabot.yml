version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

    allow:
      - dependency-type: all

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"

      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
