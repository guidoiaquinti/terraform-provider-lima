name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  # Two releases of the same tag must never run at once — they would race to
  # create the same GitHub release. Not cancel-in-progress: a half-published
  # release is worse than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-26.04
    permissions:
      contents: write # GoReleaser creates the release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history and all tags for the changelog.
          fetch-depth: 0
          # GoReleaser authenticates with GITHUB_TOKEN from the environment,
          # so the checkout credentials are dead weight in a job that handles
          # a signing key.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caching is off in the release job deliberately: a release builds
          # the artifacts users install, and a cache is writable by any
          # workflow run on a branch, which makes it a poisoning route into a
          # signed build. The cold build costs a minute; releases are rare.
          cache: false

      - name: Import the GPG signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned, not `latest`. This step builds and signs the binaries users
          # download from the Terraform Registry, so the tool that produces them
          # is part of the release's provenance: with `latest`, re-running the
          # same tag can produce artifacts from a different builder. That sits
          # badly beside the care taken elsewhere in this job — SHA-pinned
          # actions, and caching deliberately disabled to avoid poisoning.
          #
          # Keep in step with the dry run in test.yml, which is only a faithful
          # rehearsal if it runs the same version.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
