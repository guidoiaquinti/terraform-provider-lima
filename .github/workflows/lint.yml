name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The workflow never pushes; leaving the token in .git/config would
          # let any later step, or an uploaded artifact, carry it away.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: latest
          # Verify the configuration against golangci-lint's own schema before
          # linting with it. `run` tolerates invalid settings — the goconst
          # exclusions were a string where an array is required, and were still
          # applied — so without this a config that a future release rejects
          # outright reaches CI only when that release lands.
          verify: true
          args: --timeout=5m
