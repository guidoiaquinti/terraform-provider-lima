name: GitHub workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actionlint.yaml
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actionlint.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download and verify actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 60 \
            -o "$asset" "${base_url}/${asset}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --max-time 30 \
            -o checksums.txt "${base_url}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"

          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" actionlint

      - name: Run actionlint
        run: ./actionlint -color -ignore shellcheck

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1

      - name: Run zizmor
        env:
          ZIZMOR_VERSION: 1.28.0
        run: uvx --from "zizmor==${ZIZMOR_VERSION}" zizmor --persona=pedantic --collect=workflows .
