# GoReleaser configuration following the Terraform Registry's publishing
# requirements: binaries named terraform-provider-{NAME}_v{VERSION}, zipped per
# platform, with a GPG-signed SHA256SUMS manifest.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: terraform-provider-lima
    main: ./
    binary: "{{ .ProjectName }}_v{{ .Version }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      # Lima does not run on these combinations; shipping them would imply
      # support that does not exist.
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # Releases start as drafts so the changelog can be reviewed before publishing.
  draft: true
  prerelease: auto
  extra_files:
    # The Terraform Registry reads the protocol version from this file, and looks
    # for it under exactly this name. Without it the registry assumes the older
    # SDK protocol and every `terraform init` against the published provider
    # fails, so it is a release asset rather than just a repository file.
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
